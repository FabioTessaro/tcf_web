<div class="login-page-container-desktop">
    <div class="background-decorator">
        <img class="login-raven" src="/assets/tcf_web/components/login-card/assets/raven-cutout.png"/>
    </div>
    <div class="login-card-offset"></div>
    <div class="login-card">
        <div class="card-decorator">

        </div>
        <form id="loginForm" method="post" action="javascript:void(0)" name="login" autocomplete="on" class="login-form" hx-boost="false">
            <div class="login-title" data-i18n="login-card:title"></div>
            <div class="login-subtitle" data-i18n="login-card:subtitle"></div>
            <div class="login-email-section">
                <label for="loginEmail" form="loginForm" data-i18n="login-card:email.label"></label>
                <input id="loginEmail"
                    autocomplete="on"
                    form="loginForm"
                    name="email"
                    data-i18n="[placeholder]login-card:email.placeholder"
                    required
                    type="text">
            </div>
            <div class="login-password-section">
                <label for="loginPassword" form="loginForm" data-i18n="login-card:password.label">Password</label>
                <div>
                    <input id="loginPassword"
                        autocomplete="on"
                        form="loginForm"
                        name="current-password"
                        data-i18n="[placeholder]login-card:password.placeholder"
                        required
                        type="password">
                    <span class="material-symbols-sharp">visibility</span>
                </div>
                <button id="forgotSubmit" form="loginForm" type="button">
                    <div class="" data-i18n="login-card:button.forgotPassword"></div>
                </button>
            </div>
            <div class="login-submit-section">
                <button id="loginSubmit" form="loginForm" type="submit">
                    <div data-i18n="login-card:button.submit"></div>
                </button>
            </div>
        </form>
    </div>
</div>
