<div class="login-card-container">
    <form class="login-card-form" novalidate>
        <div class="login-card">
            <div class="login-card-body">

                <!-- Headings: one block per mode, only the active one is expanded.
                     Login texts come from the page (slots). The others have defaults
                     from login-card.i18n.js and can be overridden with their own slots. -->
                <div class="title-container">
                    <div class="collapse heading" data-modes="login">
                        <div class="collapse-clip"><div class="collapse-content">
                            <h1><slot name="title"></slot></h1>
                            <h5><slot name="subtitle"></slot></h5>
                        </div></div>
                    </div>
                    <div class="collapse heading" data-modes="forgot">
                        <div class="collapse-clip"><div class="collapse-content">
                            <h1><slot name="forgot-title"><span data-i18n="login-card:forgot.title"></span></slot></h1>
                            <h5><slot name="forgot-subtitle"><span data-i18n="login-card:forgot.subtitle"></span></slot></h5>
                        </div></div>
                    </div>
                    <div class="collapse heading" data-modes="sent">
                        <div class="collapse-clip"><div class="collapse-content">
                            <h1><slot name="sent-title"><span data-i18n="login-card:sent.title"></span></slot></h1>
                            <h5><slot name="sent-subtitle"><span data-i18n="login-card:sent.subtitle"></span></slot></h5>
                        </div></div>
                    </div>
                </div>

                <!-- Email field, supplied by the page: <text-field slot="email">. Login and forgot modes. -->
                <div class="collapse row-email" data-modes="login forgot">
                    <div class="collapse-clip"><div class="collapse-content">
                        <slot name="email"></slot>
                    </div></div>
                </div>

                <!-- Password field, supplied by the page: <text-field slot="password">. Login mode only. -->
                <div class="collapse row-password" data-modes="login">
                    <div class="collapse-clip"><div class="collapse-content">
                        <slot name="password"></slot>
                    </div></div>
                </div>

                <!-- Buttons: stacked in one cell, the one for the active mode is shown -->
                <div class="row-submit">
                    <div class="submit-stack">
                        <primary-button class="swap login-submit" data-modes="login"
                            label="login-card:continue" loading-label="login-card:loading"
                            icon="login" icon-loading="hourglass" icon-position="right"></primary-button>
                        <primary-button class="swap forgot-submit" data-modes="forgot"
                            label="login-card:forgot.submit" loading-label="login-card:forgot.loading"
                            icon="send" icon-loading="hourglass" icon-position="right"></primary-button>
                        <primary-button class="swap back-submit" data-modes="sent"
                            label="login-card:backToLogin"
                            icon="arrow_back" icon-position="left"></primary-button>
                    </div>
                </div>

                <!-- Back link: forgot mode only -->
                <div class="collapse row-back-link" data-modes="forgot">
                    <div class="collapse-clip"><div class="collapse-content">
                        <button class="back-link" type="button"><div class="back-link-label" data-i18n="login-card:backToLogin"></div></button>
                    </div></div>
                </div>

            </div>
        </div>
    </form>
</div>
