<div class="password-card-container">
    <form class="password-card-form" novalidate>
        <div class="password-card">
            <div class="password-card-body">

                <!-- Headings: one block per mode, only the active one is shown. Texts come from password-card.i18n.js. -->
                <div class="title-container">
                    <div class="heading" data-modes="change">
                        <h1 data-i18n="password-card:change.title"></h1>
                        <h5 data-i18n="password-card:change.subtitle"></h5>
                    </div>
                    <div class="heading" data-modes="reset">
                        <h1 data-i18n="password-card:reset.title"></h1>
                        <h5 data-i18n="password-card:reset.subtitle"></h5>
                    </div>
                    <div class="heading" data-modes="done">
                        <h1 data-i18n="password-card:done.title"></h1>
                        <h5 data-i18n="password-card:done.subtitle"></h5>
                    </div>
                    <div class="heading" data-modes="invalid">
                        <h1 data-i18n="password-card:invalid.title"></h1>
                        <h5 data-i18n="password-card:invalid.subtitle"></h5>
                    </div>
                </div>

                <!-- Fields, supplied by the page as <text-field slot="current|new|confirm">.
                     "current" is only used when changing the password while logged in. -->
                <div class="fields" data-modes="change reset">
                    <div class="row-current" data-modes="change"><slot name="current"></slot></div>
                    <div class="row-new"><slot name="new"></slot></div>
                    <div class="row-confirm"><slot name="confirm"></slot></div>
                </div>

                <!-- Buttons: stacked in one cell, the one for the active mode is shown -->
                <div class="row-submit">
                    <div class="submit-stack">
                        <primary-button class="swap save-submit" data-modes="change reset"
                            label="password-card:save" loading-label="password-card:saving"
                            icon="check" icon-loading="hourglass" icon-position="right"></primary-button>
                        <primary-button class="swap done-submit" data-modes="done"
                            label="password-card:continue"
                            icon="arrow_forward" icon-position="right"></primary-button>
                        <primary-button class="swap invalid-submit" data-modes="invalid"
                            label="password-card:backToLogin"
                            icon="arrow_back" icon-position="left"></primary-button>
                    </div>
                </div>

            </div>
        </div>
    </form>
</div>
