<button class="primary-button-container" type="button" data-state="active" data-icon-position="left">
	<span class="primary-button-surface" aria-hidden="true"></span>
	<span class="primary-button-content">
		<!-- The icon class must match $icon-style in primary-button.scss (sharp, outlined or rounded) -->
		<span class="primary-button-icon is-empty" aria-hidden="true"><span class="primary-button-icon-glyph primary-button-icon-rest material-symbols-sharp"></span><span class="primary-button-icon-glyph primary-button-icon-loading material-symbols-sharp"></span></span>
		<span class="primary-button-label"><span class="primary-button-label-text primary-button-label-rest"></span><span class="primary-button-label-text primary-button-label-loading"></span></span>
	</span>
</button>
