    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wdth,wght@62.5..100,100..900&family=Noto+Sans+SC:wght@100..900&family=Noto+Sans+JP:wght@100..900&display=swap" />

    <link rel="stylesheet" href="/assets/tcf_web/components/tokens/tokens.css"/>
    <link rel="stylesheet" href="/assets/tcf_web/components/base.css"/>

<body hx-boost="true" hx-target="#page-container" hx-select="#page-container" hx-swap="outerHTML">

    {% include "tcf_web/public/components/splash/splash.html" %}

    <div id="page-container" hx-history-elt>

    </div>
