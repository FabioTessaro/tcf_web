{% extends "tcf_web/www/base.html" %}

{# Overrides Frappe's own /update-password: tcf_web is installed after frappe, so this page wins.
   Emailed reset links (?key=...) and the logged-in change flow both end up here. #}
{% block content %}
    <password-card>
        <text-field slot="current" type="password">
            <label data-i18n="password-card:fields.current.label"></label>
            <input name="old_password" autocomplete="current-password" data-i18n="[placeholder]password-card:fields.current.placeholder">
        </text-field>

        <text-field slot="new" type="password">
            <label data-i18n="password-card:fields.new.label"></label>
            <input name="new_password" autocomplete="new-password" data-i18n="[placeholder]password-card:fields.new.placeholder">
        </text-field>

        <text-field slot="confirm" type="password">
            <label data-i18n="password-card:fields.confirm.label"></label>
            <input name="confirm_password" autocomplete="new-password" data-i18n="[placeholder]password-card:fields.confirm.placeholder">
        </text-field>
    </password-card>
{% endblock %}
